[package]
name = "weavie"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Explore Nix flake dependency graphs for selective multi-repository workspaces"
license = "MIT"
repository = "https://github.com/bboxy450/weavie"
homepage = "https://github.com/bboxy450/weavie"
readme = "README.md"
keywords = ["nix", "git", "worktree", "graph", "workspace"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
